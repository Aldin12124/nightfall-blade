<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightfall Blade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#eceffd;--surface:#fff;--text:#1b2038;--muted:#5c6690;--border:#d3d9f3;--accent:#4254e8;--on-accent:#fff;--danger:#d93a4a;--floor1:#d9e0ff;--floor2:#f1f3ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b0e22;--surface:#161b3a;--text:#eef0ff;--muted:#9aa4d3;--border:#2a3265;--accent:#8794ff;--on-accent:#0b0e22;--danger:#ff6b78;--floor1:#151b45;--floor2:#0b0e22;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0e22;--surface:#161b3a;--text:#eef0ff;--muted:#9aa4d3;--border:#2a3265;--accent:#8794ff;--on-accent:#0b0e22;--danger:#ff6b78;--floor1:#151b45;--floor2:#0b0e22;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:"Fredoka",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.hud{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px clamp(12px,4vw,24px);flex:none}
.bars{display:grid;gap:6px;width:min(56vw,280px)}
.row{display:flex;align-items:center;gap:8px}
.row small{width:50px;color:var(--muted);font-size:.78rem}
.bar{flex:1;height:14px;border-radius:7px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#e5484d}
.bar.f i{background:#3aa6ff}
.info{text-align:right;line-height:1.2}
.info b{display:block;font-size:1.5rem}
.info span{display:block;font-size:.85rem;color:var(--muted)}
main{position:relative;flex:1;min-height:0;margin:0 clamp(8px,3vw,20px) clamp(8px,3vw,20px);border-radius:20px;overflow:hidden;border:1px solid var(--border)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.overlay[hidden]{display:none}
.card{max-width:380px;width:100%;text-align:center;padding:26px 22px;border-radius:20px;background:var(--surface);border:1px solid var(--border)}
.card h1{margin:0 0 8px;font-size:2.1rem;font-weight:600}
.card p{margin:0 0 8px;color:var(--muted);line-height:1.45}
.card p.big{color:var(--text);font-size:1.1rem}
.card button{margin-top:12px;font:inherit;font-weight:600;font-size:1.1rem;cursor:pointer;padding:12px 34px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.card button:hover{filter:brightness(1.08)}
.card button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.pad{display:none;position:absolute;right:10px;bottom:10px;width:200px;height:150px}
@media (pointer:coarse){.pad{display:block}}
.pad button{position:absolute;margin:0;padding:0;border-radius:50%;width:54px;height:54px;font:600 .78rem/1.1 inherit;font-family:inherit;touch-action:none;border:2px solid var(--border);background:var(--surface);color:var(--text);opacity:.92}
.pad button.off{opacity:.4}
#b-atk{right:0;bottom:0;width:84px;height:84px;background:var(--accent);color:var(--on-accent);border-color:transparent;font-size:.95rem}
#b-dash{right:94px;bottom:8px;width:56px;height:56px}
#b-t0{right:6px;bottom:94px}
#b-t1{right:70px;bottom:80px}
#b-t2{right:134px;bottom:68px}
</style>
</head>
<body>
<div class="hud">
  <div class="bars">
    <div class="row"><small>Health</small><div class="bar"><i id="hp"></i></div></div>
    <div class="row"><small>Focus</small><div class="bar f"><i id="fo"></i></div></div>
  </div>
  <div class="info"><b id="wv">Wave 1</b><span id="lv">Level 1</span><span id="kl">0 defeated</span></div>
</div>
<main>
  <canvas id="c"></canvas>
  <div class="pad">
    <button id="b-atk">Slash</button><button id="b-dash">Dash</button>
    <button id="b-t0">Tide</button><button id="b-t1">Ember</button><button id="b-t2">Gale</button>
  </div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h1 id="title">Nightfall Blade</h1>
      <p class="big" id="msg">Hold the moonlit arena against waves of shades.</p>
      <p id="hint"></p>
      <p id="tips">Techniques spend Focus, which refills as you fight: Tide Slash, Ember Dash and Gale Spin.</p>
      <button id="go">Begin</button>
    </div>
  </div>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var cv=$('c'),ctx=cv.getContext('2d');
  var W=0,H=0,u=24,oW=0,oH=0,col={},last=0;
  var S='ready',P,E=[],B=[],FX=[],wave=0,toSpawn=0,spawnT=0,clearT=0,kills=0,best=0,shake=0,mk=0,ban={t:0,s:''};
  var keys={},held={atk:false},joy={id:null,ox:0,oy:0,x:0,y:0};
  var COST=[30,25,40],CD=[2.5,2,3.5];
  var coarse=matchMedia('(pointer: coarse)').matches;
  var stones=[];for(var i=0;i<30;i++)stones.push({x:Math.random(),y:Math.random(),r:Math.random()*2+1});
  try{best=+localStorage.getItem('nfb-best')||0}catch(e){}
  $('hint').textContent=coarse?'Drag on the left side to move. Use the buttons to slash, dash and cast.':'Move with WASD or arrows. Slash with J or click, dash with Space, techniques on 1, 2, 3.';

  function cl(v,a,b){return Math.max(a,Math.min(b,v))}
  function readColors(){var s=getComputedStyle(document.documentElement);['bg','surface','text','muted','accent','danger','floor1','floor2'].forEach(function(k){col[k]=s.getPropertyValue('--'+k).trim()})}
  function mkP(){return{x:W/2,y:H/2,rf:.6,hp:100,mhp:100,fo:100,lv:1,xp:0,face:0,mvf:0,atk:0,dash:0,dcd:0,inv:0,emb:0,mk:0,cd:[0,0,0],dx:0,dy:0}}
  function resize(){
    var r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
    W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    u=cl(Math.min(W,H)/16,18,36);
    if(oW&&P){var sx=W/oW,sy=H/oH;[P].concat(E,B).forEach(function(o){o.x*=sx;o.y*=sy})}
    oW=W;oH=H;readColors();
  }
  window.addEventListener('resize',resize);
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);new MutationObserver(readColors).observe(document.documentElement,{attributes:true})}catch(e){}

  function start(){
    if(S==='play')return;
    P=mkP();E=[];B=[];FX=[];wave=0;kills=0;shake=0;clearT=0;S='play';$('overlay').hidden=true;nextWave();
  }
  function over(){
    S='over';held.atk=false;var nb=wave>best;
    if(nb){best=wave;try{localStorage.setItem('nfb-best',String(best))}catch(e){}}
    $('title').textContent='Fallen';
    $('msg').textContent='You reached wave '+wave+' and defeated '+kills+(kills===1?' shade.':' shades.');
    $('hint').textContent=nb?'That is a new best. Well fought!':'Your best is wave '+best+'.';
    $('tips').textContent='';$('go').textContent='Try again';$('overlay').hidden=false;$('go').focus();
  }
  $('go').addEventListener('click',start);

  function nextWave(){wave++;toSpawn=4+wave*2;spawnT=.6;ban={t:2,s:'Wave '+wave};if(wave%5===0)spawn(2)}
  function spawn(t){
    if(t===undefined)t=(wave>1&&Math.random()<.28)?1:0;
    var rf=t===2?1.2:t===1?.5:.55,r=rf*u,s=Math.random()*4|0,x,y;
    var hp=t===2?160+wave*20:t===1?16+wave*3:22+wave*5;
    if(s<2){x=s?W+r:-r;y=Math.random()*H}else{y=s===2?-r:H+r;x=Math.random()*W}
    E.push({t:t,x:x,y:y,rf:rf,hp:hp,mhp:hp,kx:0,ky:0,wind:0,wm:1,cd:1+Math.random(),hit:0,mk:0,dead:false});
  }
  function puff(x,y,c){var a=Math.random()*6.28,s=u*(1+Math.random()*3);FX.push({k:'p',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:c,life:.5,max:.5,r:u*.12})}
  function hurt(d){
    if(P.inv>0||S!=='play')return;
    P.hp-=d;P.inv=.6;shake=.25;FX.push({k:'t',x:P.x,y:P.y-P.rf*u,s:'-'+d,c:'#ff4d6d',life:.7,max:.7});
    if(P.hp<=0)over();
  }
  function hitE(e,d,a,kb){
    e.hp-=d;e.hit=.12;e.kx+=Math.cos(a)*kb*u;e.ky+=Math.sin(a)*kb*u;P.fo=Math.min(100,P.fo+3);
    FX.push({k:'t',x:e.x,y:e.y-e.rf*u,s:Math.round(d),c:col.text,life:.6,max:.6});
    if(e.hp<=0&&!e.dead){
      e.dead=true;kills++;for(var i=0;i<8;i++)puff(e.x,e.y,'#b9a2ff');
      P.xp+=e.t===2?60:e.t?14:10;var need=30+P.lv*20;
      while(P.xp>=need){P.xp-=need;P.lv++;P.mhp+=10;P.hp=Math.min(P.mhp,P.hp+25);ban={t:1.6,s:'Level '+P.lv};need=30+P.lv*20}
    }
  }
  function arcHit(rad,span,d,kb,c){
    FX.push({k:'a',x:P.x,y:P.y,a:P.face,span:span,rad:rad,c:c,life:.22,max:.22});
    E.forEach(function(e){
      var dx=e.x-P.x,dy=e.y-P.y;if(Math.hypot(dx,dy)>rad+e.rf*u)return;
      var a=Math.atan2(dy,dx),df=Math.abs(Math.atan2(Math.sin(a-P.face),Math.cos(a-P.face)));
      if(span>=6.2||df<=span/2)hitE(e,d,a,kb);
    });
    B=B.filter(function(o){return Math.hypot(o.x-P.x,o.y-P.y)>rad});
  }
  function aim(){
    var b=null,bd=8*u;
    E.forEach(function(e){var d=Math.hypot(e.x-P.x,e.y-P.y);if(d<bd){bd=d;b=e}});
    P.face=b?Math.atan2(b.y-P.y,b.x-P.x):P.mvf;
  }
  function inp(){
    var x=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),y=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
    if(joy.id!==null){x+=joy.x;y+=joy.y}
    var m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return{x:x,y:y};
  }
  function attack(){
    if(S!=='play'||P.atk>0)return;aim();P.atk=.3;
    P.dash=.08;P.dx=Math.cos(P.face)*5*u;P.dy=Math.sin(P.face)*5*u;
    arcHit(2.2*u,1.9,8+P.lv*2,3,col.accent);
  }
  function dodge(){
    if(S!=='play'||P.dcd>0)return;
    var v=inp(),a=(v.x||v.y)?Math.atan2(v.y,v.x):P.face;
    P.dash=.18;P.dcd=.8;P.inv=Math.max(P.inv,.3);P.dx=Math.cos(a)*15*u;P.dy=Math.sin(a)*15*u;
  }
  function tech(i){
    if(S!=='play'||P.cd[i]>0||P.fo<COST[i])return;
    aim();P.fo-=COST[i];P.cd[i]=CD[i];
    if(i===0)arcHit(3.8*u,3.5,24+P.lv*3,6,'#1fa5e8');
    else if(i===1){P.dash=.25;P.emb=.25;P.mk=++mk;P.inv=Math.max(P.inv,.35);P.dx=Math.cos(P.face)*20*u;P.dy=Math.sin(P.face)*20*u}
    else{P.inv=Math.max(P.inv,.3);arcHit(3.4*u,6.4,18+P.lv*2,8,'#1fc98a')}
  }

  function update(dt){
    FX.forEach(function(f){f.life-=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt}});
    FX=FX.filter(function(f){return f.life>0});
    if(shake>0)shake-=dt;if(ban.t>0)ban.t-=dt;
    if(S!=='play')return;
    ['atk','dash','dcd','inv','emb'].forEach(function(k){P[k]=Math.max(0,P[k]-dt)});
    for(var i=0;i<3;i++)P.cd[i]-=dt;
    P.fo=Math.min(100,P.fo+8*dt);
    var v=inp(),r=P.rf*u;
    if(v.x||v.y)P.mvf=Math.atan2(v.y,v.x);
    if(P.atk<=0&&P.emb<=0)aim();
    if(held.atk)attack();
    if(P.dash>0){P.x+=P.dx*dt;P.y+=P.dy*dt}else{P.x+=v.x*6*u*dt;P.y+=v.y*6*u*dt}
    P.x=cl(P.x,r,W-r);P.y=cl(P.y,r,H-r);
    if(P.emb>0){puff(P.x,P.y,'#ff7a2f');
      E.forEach(function(e){if(e.mk!==P.mk&&Math.hypot(e.x-P.x,e.y-P.y)<r+e.rf*u+.5*u){e.mk=P.mk;hitE(e,20+P.lv*3,P.face,6);puff(e.x,e.y,'#ff7a2f')}})}

    if(toSpawn>0){spawnT-=dt;if(spawnT<=0){spawn();toSpawn--;spawnT=Math.max(.35,1.1-wave*.06)}}
    else if(!E.length&&!clearT){clearT=2.2;P.hp=Math.min(P.mhp,P.hp+P.mhp*.2);ban={t:2,s:'Wave '+wave+' cleared'}}
    if(clearT>0){clearT-=dt;if(clearT<=0){clearT=0;nextWave()}}

    E.forEach(function(e,i){
      var er=e.rf*u,dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
      e.hit=Math.max(0,e.hit-dt);e.x+=e.kx*dt;e.y+=e.ky*dt;var k=Math.max(0,1-dt*8);e.kx*=k;e.ky*=k;
      if(e.t===1){
        var sp=2.4*u*dt;
        if(d>7*u){e.x+=ux*sp;e.y+=uy*sp}else if(d<5*u){e.x-=ux*sp;e.y-=uy*sp}else{e.x+=-uy*sp*.6;e.y+=ux*sp*.6}
        e.x=cl(e.x,er,W-er);e.y=cl(e.y,er,H-er);
        e.cd-=dt;if(e.cd<=0){e.cd=2.3;B.push({x:e.x,y:e.y,vx:ux*5*u,vy:uy*5*u,life:4})}
        e.wind=e.cd<.5?e.cd:0;e.wm=.5;
      }else{
        var reach=er+r+.9*u;
        if(e.wind>0){e.wind-=dt;if(e.wind<=0){if(d<reach+.4*u)hurt(e.t===2?18:10);e.cd=1}}
        else if(e.cd>0)e.cd-=dt;
        else if(d<reach){e.wind=e.wm=e.t===2?.7:.5}
        else{var s2=(e.t===2?1.8:2.5)*u*dt;e.x+=ux*s2;e.y+=uy*s2}
      }
      for(var j=i+1;j<E.length;j++){var o=E[j],ox=o.x-e.x,oy=o.y-e.y,od=Math.hypot(ox,oy),m=er+o.rf*u;
        if(od&&od<m){var p=(m-od)/2;e.x-=ox/od*p;e.y-=oy/od*p;o.x+=ox/od*p;o.y+=oy/od*p}}
    });
    B.forEach(function(o){o.x+=o.vx*dt;o.y+=o.vy*dt;o.life-=dt;if(Math.hypot(o.x-P.x,o.y-P.y)<r+.3*u){o.life=0;hurt(6+wave)}});
    B=B.filter(function(o){return o.life>0&&o.x>-u&&o.x<W+u&&o.y>-u&&o.y<H+u});
    E=E.filter(function(e){return !e.dead});
  }

  function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,6.283)}
  function drawE(e){
    var r=e.rf*u;
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(e.x,e.y+r*.8,r,r*.4,0,0,6.283);ctx.fill();
    if(e.wind>0&&e.t!==1){ctx.fillStyle='rgba(255,77,109,'+(.12+.3*(1-e.wind/e.wm))+')';circ(e.x,e.y,r+P.rf*u+.9*u);ctx.fill()}
    ctx.fillStyle=e.hit>0?'#ffffff':e.t===1?'#2f6f9f':e.t===2?'#3a1d70':'#5b3a9e';
    circ(e.x,e.y,r);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(185,162,255,.7)';ctx.stroke();
    if(e.t===2){ctx.fillStyle='#3a1d70';[-1,1].forEach(function(s){ctx.beginPath();ctx.moveTo(e.x+s*r*.5,e.y-r*.8);ctx.lineTo(e.x+s*r*.85,e.y-r*1.5);ctx.lineTo(e.x+s*r*.15,e.y-r*.95);ctx.fill()})}
    ctx.fillStyle='#ff4d6d';
    [-1,1].forEach(function(s){circ(e.x+s*r*.35,e.y-r*.15,r*.16);ctx.fill()});
    if(e.t===1&&e.wind>0){circ(e.x,e.y+r*.2,r*.4);ctx.fill()}
    if(e.hp<e.mhp){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(e.x-r,e.y-r-9,r*2,4);ctx.fillStyle='#ff4d6d';ctx.fillRect(e.x-r,e.y-r-9,r*2*Math.max(0,e.hp/e.mhp),4)}
  }
  function drawP(){
    var r=P.rf*u;ctx.save();
    if(P.inv>0&&((P.inv*20)|0)%2)ctx.globalAlpha=.45;
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(P.x,P.y+r*.8,r,r*.4,0,0,6.283);ctx.fill();
    var sw=P.atk>0?P.face+(P.atk/.3-.5)*2.2:P.face,c=Math.cos(sw),s=Math.sin(sw);
    ctx.lineCap='round';ctx.strokeStyle='#1b2038';ctx.lineWidth=u*.26;
    ctx.beginPath();ctx.moveTo(P.x+c*r*.6,P.y+s*r*.6);ctx.lineTo(P.x+c*r*1.9,P.y+s*r*1.9);ctx.stroke();
    ctx.strokeStyle='#e8eeff';ctx.lineWidth=u*.14;ctx.stroke();
    ctx.fillStyle='#ff4d6d';circ(P.x-Math.cos(P.face)*r*.8,P.y-Math.sin(P.face)*r*.8,r*.35);ctx.fill();
    ctx.fillStyle=col.accent;circ(P.x,P.y,r);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#1b2038';ctx.stroke();
    ctx.fillStyle='#ffe0c2';circ(P.x,P.y,r*.55);ctx.fill();
    ctx.restore();
  }
  function drawFX(f){
    var a=f.life/f.max;ctx.globalAlpha=Math.max(0,a);
    if(f.k==='a'){var h=Math.min(f.span,6.28)/2;ctx.strokeStyle=f.c;ctx.lineCap='round';ctx.lineWidth=u*.5*a+2;ctx.beginPath();ctx.arc(f.x,f.y,f.rad*(1.1-.15*a),f.a-h,f.a+h);ctx.stroke()}
    else if(f.k==='p'){ctx.fillStyle=f.c;circ(f.x,f.y,f.r);ctx.fill()}
    else{ctx.fillStyle=f.c;ctx.font='600 '+u*.7+'px Fredoka,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(f.s,f.x,f.y-(1-a)*u)}
    ctx.globalAlpha=1;
  }
  function draw(){
    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,col.floor1);g.addColorStop(1,col.floor2);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=col.muted;ctx.globalAlpha=.18;stones.forEach(function(s){circ(s.x*W,s.y*H,s.r);ctx.fill()});
    ctx.globalAlpha=.14;ctx.strokeStyle=col.muted;ctx.lineWidth=2;circ(W/2,H/2,Math.min(W,H)*.34);ctx.stroke();ctx.globalAlpha=1;
    ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
    E.forEach(drawE);
    ctx.fillStyle='#ff4d6d';B.forEach(function(o){circ(o.x,o.y,.3*u);ctx.fill()});
    drawP();FX.forEach(drawFX);
    ctx.restore();
    if(joy.id!==null){ctx.strokeStyle=col.muted;ctx.globalAlpha=.6;ctx.lineWidth=2;circ(joy.ox,joy.oy,46);ctx.stroke();ctx.fillStyle=col.accent;ctx.globalAlpha=.7;circ(joy.ox+joy.x*46,joy.oy+joy.y*46,20);ctx.fill();ctx.globalAlpha=1}
    if(ban.t>0){ctx.globalAlpha=Math.min(1,ban.t);ctx.fillStyle=col.text;ctx.font='600 '+u*1.7+'px Fredoka,ui-rounded,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(ban.s,W/2,H*.28);ctx.globalAlpha=1}
  }
  var btns=['b-dash','b-t0','b-t1','b-t2'].map($);
  function hud(){
    $('hp').style.width=Math.max(0,P.hp/P.mhp*100)+'%';$('fo').style.width=P.fo+'%';
    $('wv').textContent='Wave '+Math.max(wave,1);$('lv').textContent='Level '+P.lv;$('kl').textContent=kills+' defeated';
    btns[0].classList.toggle('off',P.dcd>0);
    for(var i=0;i<3;i++)btns[i+1].classList.toggle('off',P.cd[i]>0||P.fo<COST[i]);
  }

  cv.addEventListener('pointerdown',function(e){
    var r=cv.getBoundingClientRect();
    if(e.pointerType==='mouse'){held.atk=true}
    else if(joy.id===null){joy.id=e.pointerId;joy.ox=e.clientX-r.left;joy.oy=e.clientY-r.top;joy.x=joy.y=0}
    try{cv.setPointerCapture(e.pointerId)}catch(x){}
  });
  cv.addEventListener('pointermove',function(e){
    if(e.pointerId!==joy.id)return;
    var r=cv.getBoundingClientRect(),dx=e.clientX-r.left-joy.ox,dy=e.clientY-r.top-joy.oy,m=Math.hypot(dx,dy),k=Math.min(m,46)/(m||1);
    joy.x=dx*k/46;joy.y=dy*k/46;
  });
  function up(e){if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0}if(e.pointerType==='mouse')held.atk=false}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('contextmenu',function(e){e.preventDefault()});

  function bind(id,down,rel){
    var b=$(id);b.addEventListener('pointerdown',function(e){e.preventDefault();down()});
    if(rel)['pointerup','pointercancel','pointerleave'].forEach(function(t){b.addEventListener(t,rel)});
  }
  bind('b-atk',function(){held.atk=true},function(){held.atk=false});
  bind('b-dash',dodge);bind('b-t0',function(){tech(0)});bind('b-t1',function(){tech(1)});bind('b-t2',function(){tech(2)});

  window.addEventListener('keydown',function(e){
    var k=e.key.length===1?e.key.toLowerCase():e.key;
    keys[k]=true;if(k.indexOf('Arrow')===0)e.preventDefault();
    if(S!=='play'){if(k===' '||k==='Enter'){e.preventDefault();start()}return}
    if(k===' '||k==='Shift'){e.preventDefault();dodge()}
    else if(k==='j')held.atk=true;
    else if(k==='1'||k==='2'||k==='3')tech(+k-1);
  });
  window.addEventListener('keyup',function(e){
    var k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;if(k==='j')held.atk=false;
  });
  window.addEventListener('blur',function(){keys={};held.atk=false});

  function frame(t){
    var dt=Math.min(.05,(t-last)/1000||0);last=t;
    update(dt);draw();hud();requestAnimationFrame(frame);
  }
  resize();P=mkP();requestAnimationFrame(frame);
})();
</script>
</body>
